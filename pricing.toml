# Frontier-API pricing per 1M tokens, USD. Two uses: the hypothetical cost of local traffic (the six
# columns in gateway-core/src/pricing.rs FRONTIER_MODELS) and the real cost of requests the unified
# listener sends to Anthropic, Gemini and OpenAI, priced by the longest key that prefixes the model id
# (`claude-opus-5-5-20260101` → claude-opus-5-5, `gemini-3.1-pro-preview` → gemini-3-1-pro).
# List prices from the providers' public pricing pages, updated 2026-10-24: flat rates, no cache, batch or
# long-context tiers (Claude Haiku 5.5 and Gemini 3.1 Pro charge more past 100K / 200K prompt tokens, so
# the figure is a lower bound there). Gemini 4 Argon is a promotional rate until 2026-11-30 (then 4.00 /
# 20.00) and the Gemini 3.6 / 3.8 Flash models until 2026-12-31 (then 1.50 / 7.50).
# Override in the user config file (location in README > Files), e.g. to use
# Gemini's rate for prompts over 200K tokens:
#   [pricing.providers.google.models.gemini-3-1-pro]
#   input_per_mtok_usd  = 4.00
#   output_per_mtok_usd = 18.00

